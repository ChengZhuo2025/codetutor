name: Feature request
description: Suggest a focused improvement for CodeTutor
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or contributor problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful version of the change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: scope
    attributes:
      label: Affected areas
      description: Routes, modules, docs, migrations, or environment variables that may change.
  - type: textarea
    id: verification
    attributes:
      label: Suggested verification
      description: What test, script, or manual check would prove this works?
